<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Estudos</title>
    <meta name="description" content="Plataforma de estudos jurídicos: materiais, questões, caderno de erros, calendário e desempenho." />
    <!-- Ícones e instalação como app (PWA) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7C3AED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estudos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Anti-"flash" de tema: aplica .dark ANTES do React renderizar.
      Mantenha a chave igual a THEME_STORAGE_KEY (src/config/constants.ts).
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('tema') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          // Cor principal personalizada (CSS pronto, gerado por src/lib/accent.ts)
          var css = localStorage.getItem('tema-cores-css');
          if (css) {
            var style = document.createElement('style');
            style.id = 'cores-tema';
            style.textContent = css;
            document.head.appendChild(style);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
