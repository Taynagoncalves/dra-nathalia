<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Anti-"flash" de tema: aplica .dark ANTES do React renderizar.
      Mantenha a chave igual a THEME_STORAGE_KEY (src/config/constants.ts).
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('tema') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          // Cor principal personalizada (CSS pronto, gerado por src/lib/accent.ts)
          var css = localStorage.getItem('tema-cores-css');
          if (css) {
            var style = document.createElement('style');
            style.id = 'cores-tema';
            style.textContent = css;
            document.head.appendChild(style);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
