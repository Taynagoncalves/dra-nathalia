# Blueprint do Render: cria o server (API) e o site (estático) a partir deste repositório.
# Render → New → Blueprint → escolha o repositório. Os valores com `sync: false`
# são pedidos no painel (não ficam no Git).

services:
  # ── API (Express) ───────────────────────────────────────────────
  - type: web
    name: estudos-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGIN # URL do site, ex.: https://estudos-site.onrender.com
        sync: false
      # Envie o JSON da service account como "Secret File" chamado serviceAccount.json:
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/serviceAccount.json
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"

  # ── Site (React, estático) ──────────────────────────────────────
  - type: web
    name: estudos-site
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA: qualquer rota (/perfil, /projetos/…) devolve o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL # URL da API, ex.: https://estudos-api.onrender.com
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_MAX_UPLOAD_MB
        value: "10"
